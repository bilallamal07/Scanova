[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-scanner"
version = "0.1.0"
description = "Security scanner for agent skill files — detects risky patterns across 6 dimensions"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.scripts]
skill-scanner = "skill_scanner.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skill_scanner"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["skill_scanner"]

[tool.coverage.report]
fail_under = 80
show_missing = true
